# ===== Configuration Nginx du FRONT-END =====
# Nginx est un serveur web très performant. Il a deux rôles ici :
#   1. servir les fichiers statiques (HTML, CSS, JS)
#   2. jouer le rôle de "reverse proxy" : rediriger les requêtes /api/...
#      vers le conteneur du back-end

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serveur DNS interne de Docker : il traduit "backend" en adresse IP.
    # valid=10s : Nginx redemande l'adresse régulièrement. Sans ça, il la
    # garderait en mémoire depuis son démarrage, et si le conteneur du
    # back-end est recréé (nouvelle IP), on obtiendrait une erreur 502.
    resolver 127.0.0.11 valid=10s;

    # Requêtes vers l'API → transmises au back-end.
    # "backend" est le nom du service dans docker-compose.yml.
    location /api/ {
        set $backend_url http://backend:3000;   # une variable force la résolution DNS à chaque requête
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tout le reste → fichiers du front-end
    location / {
        try_files $uri $uri/ =404;
    }
}
